<!-- Aero Tools Minimal V4 verified 20260801-1719 -->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PNL Parser</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap');

  :root {
    --bg:        #f0f2f5;
    --card:      #ffffff;
    --border:    #e8eaed;
    --blue:      #4361ee;
    --blue-lt:   #eef0fd;
    --green:     #2cb67d;
    --green-lt:  #e7f7f0;
    --orange:    #f4845f;
    --orange-lt: #fef0eb;
    --red:       #ef4444;
    --red-lt:    #fef2f2;
    --yellow:    #f59e0b;
    --yellow-lt: #fffbeb;
    --purple:    #7c3aed;
    --purple-lt: #f5f3ff;
    --text:      #1a1d23;
    --text-2:    #5a6072;
    --text-3:    #9ba3b5;
    --radius:    16px;
    --radius-sm: 10px;
    --shadow:    0 2px 8px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 20px rgba(0,0,0,0.08);
    --sans: 'Inter','Noto Sans TC',sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }

  /* ── Layout ── */
  .shell {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 24px 60px;
  }

  /* ── Topbar ── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-icon {
    width: 42px; height: 42px;
    background: var(--blue);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    box-shadow: 0 4px 12px rgba(67,97,238,0.35);
  }

  .logo-text {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.3px;
  }

  .logo-sub {
    font-size: 11px;
    color: var(--text-3);
    font-weight: 400;
    margin-top: 1px;
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 20px;
    letter-spacing: 0.2px;
  }
  .pill-green { background: var(--green-lt); color: var(--green); }
  .pill-green::before { content:''; width:6px;height:6px;border-radius:50%;background:var(--green); }

  /* ── Card ── */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .card-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-hint {
    font-size: 11px;
    font-weight: 400;
    color: var(--text-3);
    margin-left: 4px;
  }

  .chevron {
    color: var(--text-3);
    font-size: 14px;
  }

  /* ── Grid ── */
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }

  /* ── Input card ── */
  .input-card { margin-bottom: 16px; }

  textarea {
    width: 100%;
    min-height: 140px;
    background: #f8f9fb;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'Courier New', monospace;
    font-size: 12px;
    line-height: 1.75;
    padding: 14px 16px;
    resize: vertical;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  textarea:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(67,97,238,0.1);
  }
  textarea::placeholder { color: var(--text-3); }

  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }

  button {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    padding: 9px 20px;
    border-radius: var(--radius-sm);
    border: none;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn-primary {
    background: var(--blue);
    color: #fff;
    box-shadow: 0 3px 10px rgba(67,97,238,0.3);
  }
  .btn-primary:hover { background: #3451d1; box-shadow: 0 4px 14px rgba(67,97,238,0.4); }
  .btn-primary { transition: background 0.15s, box-shadow 0.15s, transform 0.4s cubic-bezier(0.34,1.56,0.64,1); }
  .btn-primary:active { transform: scale(0.92); transition: transform 0.08s ease-out; }

  .btn-ghost {
    background: transparent;
    color: var(--text-3);
    border: 1.5px solid var(--border);
  }
  .btn-ghost:hover { background: #f8f9fb; color: var(--text-2); }

  .btn-sm {
    font-size: 12px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 8px;
    background: #f4f5f7;
    color: var(--text-2);
    border: 1px solid var(--border);
  }
  .btn-sm:hover { background: #e8eaed; }

  .copy-btn {
    position: relative;
    overflow: hidden;
    transition: background 0.15s, transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
  }
  .copy-btn:active { transform: scale(0.93); transition: transform 0.08s ease-out; }
  .copy-label {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: opacity 0.2s ease, transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  .copy-label-success {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    opacity: 0;
    transform: scale(0.5);
    color: var(--green);
    font-weight: 600;
  }
  .copy-btn.copied { background: #ecfdf5; border-color: #a7f3d0; }
  .copy-btn.copied .copy-label-default { opacity: 0; transform: scale(0.6); }
  .copy-btn.copied .copy-label-success { opacity: 1; transform: scale(1); }

  /* Feedback widget */
  .fb-fab { position: fixed; bottom: 24px; right: 24px; width: 52px; height: 52px; border-radius: 50%; background: var(--blue); color: #fff; border: none; box-shadow: var(--shadow); cursor: pointer; font-size: 22px; z-index: 200; display: flex; align-items: center; justify-content: center; }
  .fb-overlay { position: fixed; inset: 0; background: rgba(26,45,69,.45); display: none; align-items: center; justify-content: center; z-index: 201; }
  .fb-overlay.show { display: flex; }
  .fb-box { background: var(--card); border-radius: 14px; padding: 22px 24px; width: min(380px,90vw); box-shadow: var(--shadow); }
  .fb-box h3 { font-size: 15px; margin-bottom: 14px; color: var(--text); }
  .fb-box select, .fb-box textarea, .fb-box input { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px; font-family: var(--sans); margin-bottom: 10px; color: var(--text); background: var(--surface2, #f8fafc); }
  .fb-box textarea { min-height: 80px; resize: vertical; }
  .fb-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .fb-actions button { font-family: var(--sans); font-size: 13px; font-weight: 600; padding: 9px 16px; border-radius: 10px; border: 1px solid var(--border); cursor: pointer; background: #f5f7fa; color: var(--text); }
  .fb-actions button:hover { opacity: 0.95; }
  .fb-msg { font-size: 12px; margin-top: 8px; min-height: 16px; }
  .fb-star-row { display: flex; gap: 5px; margin-bottom: 10px; }
  .fb-star { font-size: 24px; cursor: pointer; color: #d1dce8; transition: color .1s, transform .1s; user-select: none; line-height: 1; }
  .fb-star:hover, .fb-star.active { color: #f0b429; }
  .fb-star:hover { transform: scale(1.15); }
  .fb-star-hint { font-size: 11px; color: var(--text-3); margin-top: -6px; margin-bottom: 10px; min-height: 14px; }

  /* ── Firework particles ── */
  .firework-particle {
    position: fixed;
    width: 6px; height: 6px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 999;
    animation: firework-fly 0.7s ease-out forwards;
  }
  @keyframes firework-fly {
    0%   { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--fx), var(--fy)) scale(0.3); opacity: 0; }
  }

  /* ── Result section entrance (stagger entrance) ── */
  #result-section {
    display: none;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.45s cubic-bezier(0.16,1,0.3,1),
                transform 0.45s cubic-bezier(0.16,1,0.3,1);
  }
  #result-section.show {
    opacity: 1;
    transform: translateY(0);
  }

  /* ── Input error shake ── */
  @keyframes shake-x {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }
  .input-card.shake {
    animation: shake-x 0.45s cubic-bezier(0.36,0.07,0.19,0.97) both;
  }
  textarea.error {
    border-color: var(--red);
    box-shadow: 0 0 0 3px rgba(239,68,68,0.12);
  }

  /* ── Stat cards ── */

  .stats-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .stat-chip {
    background: #f8f9fb;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 18px;
    min-width: 90px;
    flex: 1;
    opacity: 0;
    transform: translateY(10px) scale(0.94);
    transition: opacity 0.4s cubic-bezier(0.34,1.56,0.64,1),
                transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }
  .stat-chip.in {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .stat-chip-num {
    font-size: 28px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -1px;
  }

  .stat-chip-label {
    font-size: 11px;
    color: var(--text-3);
    font-weight: 500;
    margin-top: 5px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  .num-blue   { color: var(--blue); }
  .num-orange { color: var(--orange); }
  .num-green  { color: var(--green); }
  .num-red    { color: var(--red); }
  .num-purple { color: var(--purple); }
  .num-yellow { color: var(--yellow); }
  .num-default{ color: var(--text-2); }

  /* ── Table ── */
  .table-wrap {
    overflow-x: auto;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  thead tr { background: #f8f9fb; }

  th {
    padding: 11px 16px;
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: var(--text-3);
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  th.sortable {
    cursor: pointer;
    user-select: none;
    position: relative;
    padding-right: 24px;
    transition: color 0.12s, background 0.12s;
  }
  th.sortable:hover { color: var(--blue); background: var(--blue-lt); }
  th.sortable::after {
    content: '⇅';
    position: absolute;
    right: 7px;
    opacity: 0.3;
    font-size: 10px;
  }
  th.sortable.asc::after  { content: '↑'; opacity: 1; color: var(--blue); }
  th.sortable.desc::after { content: '↓'; opacity: 1; color: var(--blue); }

  td {
    padding: 11px 16px;
    border-bottom: 1px solid #f3f4f6;
    color: var(--text);
    vertical-align: middle;
  }
  tr:last-child td { border-bottom: none; }
  tbody tr { transition: background 0.1s; }
  tbody tr:hover td { background: #fafbfc; }

  .deleted-row td { opacity: 0.4; }

  /* ── Badges ── */
  .class-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px; height: 26px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  .class-F { background: var(--yellow-lt); color: var(--yellow); }
  .class-C, .class-J { background: var(--orange-lt); color: var(--orange); }
  .class-W { background: var(--blue-lt); color: var(--blue); }
  .class-P { background: var(--purple-lt); color: var(--purple); }
  .class-Y, .class-X, .class-default { background: #f3f4f6; color: var(--text-2); }

  .ssr-tag {
    display: inline-flex;
    align-items: center;
    background: var(--yellow-lt);
    color: var(--yellow);
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 6px;
    margin-right: 3px;
    letter-spacing: 0.2px;
  }

  .del-tag {
    display: inline-flex;
    align-items: center;
    background: var(--red-lt);
    color: var(--red);
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 6px;
  }

  .ticket-num {
    font-family: 'Courier New', monospace;
    font-size: 12px;
    color: var(--text-2);
    letter-spacing: 0.3px;
  }
  .no-ticket { color: var(--text-3); font-size: 13px; }
  .seq-num { color: var(--text-3); font-size: 12px; font-weight: 500; }
  .bn-num  {
    color: var(--blue);
    font-family: 'Courier New', monospace;
    font-size: 12px;
    font-weight: 700;
    background: var(--blue-lt);
    padding: 2px 7px;
    border-radius: 6px;
  }
  .seat-num {
    font-family: 'Courier New', monospace;
    font-size: 12px;
    color: var(--text-2);
    font-weight: 600;
  }
  .pax-name {
    font-weight: 600;
    font-size: 13px;
    color: var(--text);
  }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── Divider ── */
  .section-gap { margin-bottom: 16px; }
</style>

<style id="minimal-retheme">
  :root {
    --bg: #f6f6f3;
    --card: #ffffff;
    --border: #e7e7e2;
    --blue: #4459d8;
    --blue-lt: #eef1ff;
    --green: #188b62;
    --green-lt: #eaf7f1;
    --orange: #df8a43;
    --orange-lt: #fff2e8;
    --red: #d9485f;
    --red-lt: #fff0f2;
    --yellow: #c98a11;
    --yellow-lt: #fff7df;
    --purple: #7c61d9;
    --purple-lt: #f3efff;
    --text: #171717;
    --text-2: #5a5a55;
    --text-3: #919189;
    --shadow: 0 8px 24px rgba(18,18,18,0.04);
    --shadow-md: 0 16px 32px rgba(18,18,18,0.06);
    --radius: 18px;
    --radius-sm: 12px;
  }
  body {
    background:
      radial-gradient(circle at top left, rgba(68,89,216,.05), transparent 28%),
      linear-gradient(180deg, #fafaf7 0%, var(--bg) 100%);
  }
  .shell {
    max-width: 1180px;
    padding: 28px 24px 60px;
  }
  .topbar { display: none; }
  .intro-card {
    margin-bottom: 16px;
    background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(255,255,255,.88));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
  }
  .intro-eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    color: var(--text-3);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .intro-title {
    font-size: 26px;
    line-height: 1.15;
    letter-spacing: -.03em;
    font-weight: 800;
    margin-bottom: 10px;
    color: var(--text);
  }
  .intro-title span { color: var(--blue); }
  .intro-sub {
    font-size: 13px;
    color: var(--text-2);
    max-width: 760px;
    line-height: 1.7;
  }
  .card {
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
  }
  .input-card textarea {
    background: #fbfbf8;
    border-color: var(--border);
    min-height: 180px;
  }
  .input-card .card-header { margin-bottom: 16px; }
  .card-title { font-size: 16px; }
  .card-hint { font-size: 12px; }
  .btn-primary {
    background: var(--blue);
    box-shadow: 0 8px 16px rgba(68,89,216,.14);
  }
  .btn-primary:hover { background: #394dc8; box-shadow: 0 10px 18px rgba(68,89,216,.18); }
  .btn-ghost, .btn-sm {
    background: #fbfbf8;
    color: var(--text-2);
  }
  .btn-row { margin-top: 16px; }
  .stats-row { gap: 10px; }
  .stat-chip {
    background: #fff;
    border: 1px solid var(--border);
    box-shadow: 0 3px 10px rgba(17,17,17,.02);
  }
  .table-wrap { border-color: var(--border); background: #fff; }
  thead tr { background: #fbfbf8; }
  tbody tr:hover td { background: #fcfcf9; }
  .copy-btn.copied { background: #edf8f3; }
  .fb-fab, .fb-overlay { display: none !important; }
  @media (max-width: 680px) {
    .shell { padding: 18px 14px 32px; }
    .intro-card { padding: 18px 18px; }
    .intro-title { font-size: 22px; }
    .card { padding: 18px; }
    .stats-row { flex-direction: column; }
  }
</style>


<style id="motion-v4">
  @keyframes cardRise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes rowReveal {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes successHalo {
    0% { box-shadow: 0 0 0 0 rgba(24,139,98,.28); }
    100% { box-shadow: 0 0 0 14px rgba(24,139,98,0); }
  }
  .shell { padding-top: 28px; }
  .input-card {
    position: relative;
    overflow: hidden;
    animation: cardRise .55s cubic-bezier(.16,1,.3,1) both;
    transition: transform .35s cubic-bezier(.16,1,.3,1), box-shadow .35s ease, border-color .25s ease;
  }
  .input-card::before {
    content: '';
    position: absolute;
    left: 20px;
    right: 20px;
    top: 0;
    height: 2px;
    border-radius: 999px;
    background: linear-gradient(90deg, transparent, var(--blue), transparent);
    transform: scaleX(0);
    transition: transform .45s cubic-bezier(.16,1,.3,1);
  }
  .input-card:focus-within {
    transform: translateY(-2px);
    border-color: rgba(68,89,216,.22);
    box-shadow: 0 16px 38px rgba(18,18,18,.065);
  }
  .input-card:focus-within::before { transform: scaleX(1); }
  textarea { transition: border-color .2s ease, box-shadow .2s ease, background .25s ease, transform .25s ease; }
  textarea:focus { background: #fff; transform: translateY(-1px); }
  button { position: relative; overflow: hidden; }
  button::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.28) 50%, transparent 65%);
    transform: translateX(-140%);
    transition: transform .65s cubic-bezier(.16,1,.3,1);
  }
  button:hover::after { transform: translateX(140%); }
  .btn-primary:hover, .btn-ghost:hover, .btn-sm:hover { transform: translateY(-2px); }
  .btn-primary:active, .btn-ghost:active, .btn-sm:active { transform: scale(.94); transition-duration: .08s; }
  #result-section.show .card { animation: cardRise .52s .08s cubic-bezier(.16,1,.3,1) both; }
  #result-body tr { opacity: 0; animation: rowReveal .38s cubic-bezier(.16,1,.3,1) forwards; }
  .stat-chip { transition: transform .3s cubic-bezier(.34,1.56,.64,1), box-shadow .25s ease, border-color .25s ease; }
  .stat-chip:hover { transform: translateY(-4px); border-color: rgba(68,89,216,.2); box-shadow: 0 12px 22px rgba(18,18,18,.055); }
  .copy-btn.success-pulse { animation: successHalo .65s ease-out; }
  .logo-icon { font-size: 10px; letter-spacing: .08em; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>

</head>
<body>

<div class="shell">

  <!-- Topbar -->
  <div class="topbar">
    <div class="logo">
      <div class="logo-icon">PNL</div>
      <div>
        <div class="logo-text">PNL Parser</div>
        <div class="logo-sub">Passenger Name List 解析工具</div>
      </div>
    </div>
    <div class="topbar-right">
      <span class="pill pill-green">即時解析</span>
    </div>
  </div>

  <!-- Input -->
  <div class="card input-card section-gap">
    <div class="card-header">
      <div class="card-title">貼入內容</div>
    </div>
    <textarea id="pnl-input" placeholder="貼上 PNL 電報內容..."></textarea>
    <div class="btn-row">
      <button class="btn-primary" onclick="parsePNL()">解析</button>
      <button class="btn-ghost" onclick="clearAll()">清除</button>
    </div>
  </div>

  <!-- Results -->
  <div id="result-section">

    <!-- Stats chips -->
    <div class="stats-row" id="stats-row"></div>

    <!-- Table card -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">
          解析結果
          <span class="card-hint">點擊欄位標題排序，再點反轉</span>
        </div>
        <button class="btn-sm copy-btn" id="copy-btn" onclick="copyTSV()">
      <span class="copy-label copy-label-default">複製 TSV</span>
      <span class="copy-label copy-label-success">已複製</span>
    </button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th class="sortable" onclick="sortTable('bn')" id="th-bn">BN</th>
              <th class="sortable" onclick="sortTable('name')" id="th-name">旅客姓名</th>
              <th class="sortable" onclick="sortTable('ticket')" id="th-ticket">票號 (ET NUMBER)</th>
              <th class="sortable" onclick="sortTable('cabin')" id="th-cabin">艙等</th>
              <th class="sortable" onclick="sortTable('seat')" id="th-seat">座位</th>
              <th class="sortable" onclick="sortTable('ssr')" id="th-ssr">備註</th>
            </tr>
          </thead>
          <tbody id="result-body"></tbody>
        </table>
      </div>
    </div>

  </div><!-- /result-section -->

</div><!-- /shell -->

<script>
let parsedData = [];
let currentSort = { key: null, dir: 1 };

// ── cabin colour map for stat chips ──
const cabinColor = {
  F: 'num-yellow',
  C: 'num-orange', J: 'num-orange',
  W: 'num-blue',
  P: 'num-purple',
  Y: 'num-default', X: 'num-default',
};

function sortTable(key) {
  const th = document.getElementById('th-' + key);
  if (currentSort.key === key) {
    currentSort.dir *= -1;
  } else {
    currentSort.key = key;
    currentSort.dir = 1;
    document.querySelectorAll('th.sortable').forEach(t => t.classList.remove('asc','desc'));
  }
  th.classList.remove('asc','desc');
  th.classList.add(currentSort.dir === 1 ? 'asc' : 'desc');

  const classOrder = {F:1,C:2,J:2,W:3,P:4,Y:5,X:6};
  parsedData.sort((a, b) => {
    let av, bv;
    switch(key) {
      case 'bn':     return (a.bn - b.bn) * currentSort.dir;
      case 'name':   av = a.name; bv = b.name; break;
      case 'ticket': av = a.ticket||''; bv = b.ticket||''; break;
      case 'cabin':
        return ((classOrder[a.cabin]||7) - (classOrder[b.cabin]||7)) * currentSort.dir;
      case 'seat':
        const ps = s => { const m=s.match(/^(\d+)([A-Z])$/); return m?parseInt(m[1])*100+m[2].charCodeAt(0):9999; };
        return (ps(a.seat) - ps(b.seat)) * currentSort.dir;
      case 'ssr':
        av = (a.ssr||'')+(a.deleted?'DELETED':'');
        bv = (b.ssr||'')+(b.deleted?'DELETED':'');
        break;
    }
    return av<bv ? -currentSort.dir : av>bv ? currentSort.dir : 0;
  });
  renderResults();
}

function parsePNL() {
  const inputEl = document.getElementById('pnl-input');
  const raw = inputEl.value.trim();
  if (!raw) {
    inputEl.classList.add('error');
    const card = inputEl.closest('.input-card');
    card.classList.remove('shake');
    void card.offsetWidth; // force reflow so animation can retrigger
    card.classList.add('shake');
    clearTimeout(inputEl._errTimer);
    inputEl._errTimer = setTimeout(() => inputEl.classList.remove('error'), 1400);
    setTimeout(() => card.classList.remove('shake'), 500);
    inputEl.focus();
    return;
  }

  parsedData = [];
  currentSort = { key: null, dir: 1 };
  document.querySelectorAll('th.sortable').forEach(th => th.classList.remove('asc','desc'));

  const lines = raw.split('\n');
  const blocks = [];
  let current = [];

  for (const line of lines) {
    if (/^\d+\.\s/.test(line.trim()) && current.length > 0) {
      blocks.push(current);
      current = [line];
    } else {
      current.push(line);
    }
  }
  if (current.length > 0) blocks.push(current);

  let idx = 1;
  for (const block of blocks) {
    const pax = parsePassenger(block.join(' '), idx++);
    if (pax) parsedData.push(pax);
  }

  // Deduplicate
  const seen = new Set();
  parsedData = parsedData.filter(p => {
    const key = `${p.ticket||''}|${p.seat}`;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });

  // Default: sort by cabin
  const classOrder = {F:1,C:2,J:2,W:3,P:4,Y:5,X:6};
  parsedData.sort((a,b) => (classOrder[a.cabin]||7) - (classOrder[b.cabin]||7));

  renderResults();
}

function parsePassenger(text, idx) {
  const bnMatch = text.match(/\bBN(\d+)\b/);
  const bn = bnMatch ? parseInt(bnMatch[1]) : idx;

  const nameMatch = text.match(/\d+\.\s+\d*([A-Z]+\/[A-Z]+)/);
  const name = nameMatch ? nameMatch[1].replace('/', ' ') : '—';

  const seatMatch = text.match(/\*?(\d{1,3}[A-Z])\s+([A-Z])\s/);
  const seat  = seatMatch ? seatMatch[1] : '—';
  const cabin = seatMatch ? seatMatch[2] : '—';

  const etMatch = text.match(/ET\s*NUMBER[:\s]+(\d{13})/);
  const ticket = etMatch ? etMatch[1] : null;

  const deleted = /DELETED/i.test(text);

  const ssrCodes = ['WCHR','WCHC','WCHS','UMNR','UM','VGML','KSML','BBML','SPML','MEDA','LANG'];
  const ssrMatch = ssrCodes.filter(c => new RegExp(`\\b${c}\\b`).test(text));

  if (name === '—' && !ticket) return null;
  return { idx, bn, name, seat, cabin, ticket, deleted, ssr: ssrMatch.join(' ') };
}

function renderResults() {
  if (parsedData.length === 0) return;
  const section = document.getElementById('result-section');
  section.style.display = 'block';
  section.classList.remove('show');
  requestAnimationFrame(() => requestAnimationFrame(() => section.classList.add('show')));

  // Stats
  const classCounts = {};
  let noTicket = 0;
  for (const p of parsedData) {
    classCounts[p.cabin] = (classCounts[p.cabin]||0) + 1;
    if (!p.ticket) noTicket++;
  }

  const classOrder = {F:1,C:2,J:2,W:3,P:4,Y:5,X:6};
  const sortedCabins = Object.entries(classCounts)
    .sort(([a],[b]) => (classOrder[a]||7) - (classOrder[b]||7));

  let statsHtml = sortedCabins.map(([c,n]) => {
    const col = cabinColor[c] || 'num-default';
    return `<div class="stat-chip">
      <div class="stat-chip-num ${col}" data-target="${n}">0</div>
      <div class="stat-chip-label">${c} 艙</div>
    </div>`;
  }).join('');

  statsHtml += `<div class="stat-chip">
    <div class="stat-chip-num num-default" data-target="${parsedData.length}">0</div>
    <div class="stat-chip-label">Total PAX</div>
  </div>`;

  if (noTicket > 0) {
    statsHtml += `<div class="stat-chip">
      <div class="stat-chip-num num-red" data-target="${noTicket}">0</div>
      <div class="stat-chip-label">No Ticket</div>
    </div>`;
  }

  const statsRow = document.getElementById('stats-row');
  statsRow.innerHTML = statsHtml;

  // Stagger each chip in, then count its number up
  statsRow.querySelectorAll('.stat-chip').forEach((chip, i) => {
    setTimeout(() => {
      chip.classList.add('in');
      animateCount(chip.querySelector('.stat-chip-num'));
    }, i * 90);
  });

  // Rows
  const rows = parsedData.map((p, i) => {
    const cls = p.cabin && p.cabin !== '—' ? p.cabin : 'default';
    const badge  = `<span class="class-badge class-${cls}">${p.cabin}</span>`;
    const ticket = p.ticket
      ? `<span class="ticket-num">${p.ticket}</span>`
      : `<span class="no-ticket">—</span>`;
    const ssrHtml = p.ssr
      ? p.ssr.split(' ').map(s => `<span class="ssr-tag">${s}</span>`).join('')
      : '';
    const delHtml = p.deleted ? '<span class="del-tag">DEL</span>' : '';
    const rowCls  = p.deleted ? 'deleted-row' : '';
    return `<tr class="${rowCls}">
      <td class="seq-num">${i+1}</td>
      <td><span class="bn-num">${p.bn}</span></td>
      <td class="pax-name">${p.name}</td>
      <td>${ticket}</td>
      <td>${badge}</td>
      <td class="seat-num">${p.seat}</td>
      <td>${ssrHtml}${delHtml}</td>
    </tr>`;
  }).join('');

  const resultBody = document.getElementById('result-body');
  resultBody.innerHTML = rows;
  resultBody.querySelectorAll('tr').forEach((row, i) => {
    row.style.animationDelay = Math.min(i * 24, 360) + 'ms';
  });
}

function animateCount(el) {
  const target = parseInt(el.dataset.target, 10);
  if (Number.isNaN(target)) return;
  const duration = 600;
  const t0 = performance.now();
  function step(t) {
    const p = Math.min((t - t0) / duration, 1);
    const eased = 1 - Math.pow(1 - p, 3); // ease-out cubic
    el.textContent = Math.round(target * eased);
    if (p < 1) requestAnimationFrame(step);
    else el.textContent = target;
  }
  requestAnimationFrame(step);
}

function copyTSV() {
  const lines = ['票號\t艙等'];
  for (const p of parsedData) {
    if (p.ticket) lines.push(`${p.ticket}\t${p.cabin}`);
  }
  navigator.clipboard.writeText(lines.join('\n'));
  const btn = document.getElementById('copy-btn');
  btn.classList.add('copied');
  clearTimeout(btn._resetTimer);
  btn._resetTimer = setTimeout(() => { btn.classList.remove('copied'); }, 1400);
  successPulse(btn);
}

function successPulse(btn) {
  btn.classList.remove('success-pulse');
  void btn.offsetWidth;
  btn.classList.add('success-pulse');
  clearTimeout(btn._pulseTimer);
  btn._pulseTimer = setTimeout(() => btn.classList.remove('success-pulse'), 650);
}

function clearAll() {
  const inputEl = document.getElementById('pnl-input');
  inputEl.value = '';
  inputEl.classList.remove('error');
  const section = document.getElementById('result-section');
  section.classList.remove('show');
  section.style.display = 'none';
  document.getElementById('copy-btn').classList.remove('copied');
  parsedData = [];
  currentSort = { key: null, dir: 1 };
}

const FEEDBACK_ENDPOINT = 'https://script.google.com/macros/s/AKfycbyyLemZKexsiJmzsBWDUzTuOXwKUzWZV3FLjozjWh58w47iEqD0T7Cl63pXFn-ipCokFQ/exec';

function fbOpen(){ document.getElementById('fb-overlay').classList.add('show'); document.getElementById('fb-msg').textContent=''; }
function fbClose(){ document.getElementById('fb-overlay').classList.remove('show'); }

const FB_STAR_LABELS = ['','很差','不太好','普通','不錯','非常好'];
let fbRating = 0;
document.querySelectorAll('.fb-star').forEach(s => {
  s.addEventListener('mouseenter', () => { fbHighlight(+s.dataset.val); document.getElementById('fb-star-hint').textContent = FB_STAR_LABELS[+s.dataset.val]; });
  s.addEventListener('mouseleave', () => { fbHighlight(fbRating); document.getElementById('fb-star-hint').textContent = fbRating ? FB_STAR_LABELS[fbRating] : ''; });
  s.addEventListener('click',      () => { fbRating = fbRating === +s.dataset.val ? 0 : +s.dataset.val; fbHighlight(fbRating); document.getElementById('fb-star-hint').textContent = fbRating ? FB_STAR_LABELS[fbRating] : ''; });
});
function fbHighlight(val){ document.querySelectorAll('.fb-star').forEach(s => s.classList.toggle('active', +s.dataset.val <= val)); }

async function fbSubmit(){
  const type=document.getElementById('fb-type').value;
  const desc=document.getElementById('fb-desc').value.trim();
  const contact=document.getElementById('fb-contact').value.trim();
  const msgEl=document.getElementById('fb-msg');
  if(!desc){ msgEl.textContent='請輸入內容'; msgEl.style.color='var(--red)'; return; }
  msgEl.textContent='送出中...'; msgEl.style.color='var(--text-3)';
  try{
    const res = await fetch(FEEDBACK_ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({type,description:desc,contact,rating:fbRating||null,page:location.href})});
    if (!res.ok) throw new Error('status ' + res.status);
    msgEl.textContent='已送出，謝謝回報！'; msgEl.style.color='var(--green)';
    document.getElementById('fb-desc').value=''; document.getElementById('fb-contact').value='';
    fbRating=0; fbHighlight(0); document.getElementById('fb-star-hint').textContent='';
    setTimeout(fbClose,1200);
  }catch(err){
    msgEl.textContent='送出失敗，請稍後再試'; msgEl.style.color='var(--red)';
  }
}
</script>
</body>
</html>
